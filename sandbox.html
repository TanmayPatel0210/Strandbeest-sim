<!DOCTYPE html>
<html>
    <head>
        <title>Sandbox</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body id="bodybasic">
      <div id="canvasWrap">
          <h1 style="top: 0; font-family: monospace;color: antiquewhite;" >Beest Sandbox</h1>
          <canvas id="trailCanvas" width="960" height="770" ></canvas>
          <canvas id="myCanvas" width="960" height="770" ></canvas>

      </div>
      <div id="controls">
        <h1 style="color: antiquewhite;">Controls</h1>
        <label for="slider">Speed</label>
        <input type="range" id="slider" min="0.01" max="0.05" step="0.001" value="0.025">
      
        <button id="pauseBtn" style="color: antiquewhite; font-size: larger;">Pause/Play</button>
        <div id="control">
          <span style="color:#ff4444">●</span><input type="range" id="sliderab" min="0" max="152" step="5" value="76">
          <span style="color:#ff00ff">●</span><input type="range" id="slidercd" min="0" max="400" step="5" value="152">
          <span style="color:#00ffff">●</span><input type="range" id="sliderbd" min="0" max="400" step="5" value="166">
          <span style="color:#ffff00">●</span><input type="range" id="sliderce" min="0" max="400" step="5" value="158">
          <span style="color:#00ff88">●</span><input type="range" id="sliderde" min="0" max="400" step="5" value="222">
          <span style="color:#0a0095">●</span><input type="range" id="slideref" min="0" max="400" step="5" value="262">
          <span style="color:#006f00">●</span><input type="range" id="slidergf" min="0" max="400" step="5" value="160">
          <span style="color:#00aaff">●</span><input type="range" id="sliderbg" min="0" max="400" step="5" value="210">
          <span style="color:#ff8800">●</span><input type="range" id="slidercg" min="0" max="400" step="5" value="98">
          <span style="color:#ffffff">●</span><input type="range" id="slidergh" min="0" max="400" step="5" value="220">
          <span style="color:#646464">●</span><input type="range" id="sliderfh" min="0" max="400" step="5" value="230">
          <input type="range" id="sliderrad" min="230" max="800" step="5" value="430">
        </div>

        <a href="sandbox.html"><button style="font-size: larger;color: bisque; margin-top: 10px;">Reset Canvas</button></a>
        <a href="legs.html"><button style="font-size: larger;color: bisque; margin-top: 10px;">Next Section</button></a>
        <a href="Home.html"><button style="font-size: larger;color: bisque; margin-top: 10px;">Back</button></a>
      </div>
    </div>    
    <script src="script-sand.js"></script>
    </body>
</html>
