<!DOCTYPE html>
<html>
    <head>
        <title>Basic Jansen's Linkage</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body id="bodybasic">
      <div id="canvasWrap">
          <h1 style="top: 0; font-family: monospace;color: antiquewhite;" >Anatomy of Jansen's Linkage</h1>
          <canvas id="trailCanvas" width="960" height="770" ></canvas>
          <canvas id="myCanvas" width="960" height="770" ></canvas>

      </div>
      <div id="controls">
        <h1 style="color: antiquewhite;">Controls</h1>
        <label for="slider">Speed</label>
        <input type="range" id="slider" min="0.01" max="0.05" step="0.001" value="0.025">
      
        <button id="pauseBtn" style="color: antiquewhite; font-size: larger;">Pause/Play</button>

        <input type="range" id="sliderab" min="0" max="152" step="5" value="76">
        <input type="range" id="slidercd" min="0" max="400" step="5" value="152">
        <input type="range" id="sliderbd" min="0" max="400" step="5" value="166">
        <input type="range" id="sliderce" min="0" max="400" step="5" value="158">
        <input type="range" id="sliderde" min="0" max="400" step="5" value="222">
        <input type="range" id="slideref" min="0" max="400" step="5" value="262">
        <input type="range" id="slidergf" min="0" max="400" step="5" value="160">
        <input type="range" id="sliderbg" min="0" max="400" step="5" value="210">
        <input type="range" id="slidercg" min="0" max="400" step="5" value="98">
        <input type="range" id="slidergh" min="0" max="400" step="5" value="220">
        <input type="range" id="sliderfh" min="0" max="400" step="5" value="230">
        <input type="range" id="sliderrad" min="230" max="800" step="5" value="430">
        
        <a href="sandbox.html"><button style="font-size: larger;color: bisque; margin-top: 10px;">Reset Canvas</button></a>
        <a href="legs.html"><button style="font-size: larger;color: bisque; margin-top: 10px;">Next Section</button></a>
        <a href="Home.html"><button style="font-size: larger;color: bisque; margin-top: 10px;">Back</button></a>
      </div>
    </div>    
    <script src="script-sand.js"></script>
    </body>
</html>
